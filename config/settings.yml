lookback_hours: 30

# event 取代了原本的 sentiment。sentiment 在 Alpha Vantage 移除後恆為 None，
# 那 0.20 權重等於白給；而 coverage 在只有單一來源時也幾乎恆定，
# 結果排序實際上退化成「誰最新誰贏」，通訊社的地緣政治單行標題因此屠榜。
rank_weights:
  event:     0.30   # 有沒有發生一件事
  relevance: 0.20   # 這件事關不關你的持股/追蹤清單
  source:    0.25   # 誰寫的 — 見下面 source_tiers
  coverage:  0.10
  recency:   0.10
  move:      0.05
  source_default: 0.3   # 沒列在 source_tiers 的來源

# 來源權重。沒有這一層,Yahoo 逐檔 feed 會贏走全部版面:
# 它一天吐 400+ 條、每條都提到追蹤標的所以相關性滿分,而真正有密度的來源
# (SEC 申報、SemiAnalysis 拆解)常常整篇不寫代號,相關性是 0。
# 名稱比對取斜線前的字首,所以 "Yahoo/NVDA"、"SEC EDGAR/MRVL" 都對得上。
source_tiers:
  "SEC EDGAR":     1.00   # 一手法定文件
  "SemiAnalysis":  0.85
  "Stratechery":   0.75
  "The Block":     0.65
  "CoinDesk":      0.65
  "DC Dynamics":   0.65
  "ServeTheHome":  0.60
  "CNBC":          0.55
  "The Register":  0.50
  "The Defiant":   0.50
  "Tom's Hardware": 0.30   # 大量消費級/復古硬體,對本報訊噪比偏低
  "CoinTelegraph": 0.40
  "SA Market":     0.30
  "Marketaux":     0.20
  "Yahoo":         0.15   # 量大品質雜,只當相關性補充

selection:
  max_items_total: 14
  dedupe_title_threshold: 85
  # 0 = 不再為了「每個主題至少一條」而硬塞。市場配額(下面 min_items_per_market)已經
  # 保證了加密的版面,主題不需要再被人工攤平 —— 那只會讓不相關的稿子擠進來。
  min_items_per_theme: 0
  max_items_per_theme: 4      # 防止 macro_other 這個 catch-all 吃掉整份摘要
  # 事件分數門檻。寧可出 10 條真的有事發生的，也不要湊滿 14 條裡混 4 條選股專欄。
  # 若當天沒有任何一條過關，這個門檻會自動忽略(不會出空的日報)。
  min_event_score: 0.6
  # 逐檔新聞全是美股，會把加密整個擠掉。加密是報告裡獨立的一節，不該跟主題搶名額。
  min_items_per_market:
    crypto: 5
  max_items_per_source: 4   # 單一來源家族上限,防止 Yahoo 逐檔 feed 洗版

# 事件偵測 — 判斷標題在講「發生了一件事」還是「盤面在動」。
event_scoring:
  enabled: true
  filler_penalty: 0.5
  signals:
    # 公司行為
    - earnings, results, guidance, outlook, forecast, beats, misses
    - acquire, acquisition, merger, buyout, takeover, stake, warrant
    - partnership, deal, contract, agreement, order worth, supply
    - launch, unveil, announce, debut, rollout, ships
    - layoff, job cuts, restructuring, spin-off, IPO, buyback, dividend
    # 人事
    - resign, steps down, departs, ousted, appoints, names, succeeds, hires
    # 監管/法律
    - lawsuit, sues, settlement, probe, investigation, subpoena, fine, penalty
    - SEC, DOJ, FTC, antitrust, approval, approves, rejects, ban, sanctions, tariff
    - bill, act, vote, ruling, court
    # 賣方/資金
    - upgrade, downgrade, price target, initiates coverage, raises, cuts rating
    - inflow, outflow, raises funding, valuation
    # 加密特有
    - stablecoin, tokenized, custody, staking, validator, mainnet, halving, unlock
    - ETF approval, spot ETF, reserve, treasury
  filler:
    # 沒有主詞的盤面描述 — 這些不是事件
    - shares drift, stocks drift, steady as, little changed, mixed
    - ahead of, what to watch, here's what, live updates, wrap
    - opening bell, closing bell, markets today, market wrap, midday
    - things to know, top stories, briefing, roundup
    # 評論/選股專欄 — 有事件關鍵字但沒有事件
    - Cramer, here's who, here's why, here's how, how to play, what to know
    - analyst says, strategist says, specialist says, expert says
    - top picks, best stocks, stocks to, gems, watch list, screen for
    - isn't buying, five things, 5 things, three things, could benefit
    # SEO 標題農場 — 這些會塞滿事件關鍵字但沒有事件
    - why is it, getting attention today, should you buy, is it time to
    - upside in, analysts see, price target of, billionaire, billionaires
    - dumped, loaded up, piling into, quietly, this stock, motley fool
    - read this before, what you need to know, better buy, vs., versus
    - and more stock, etfs in focus, what's the deal with, stocks that defined
    - moving in, movers, on watch, stock split, zacks, motley

sources:
  whitelist: []
  blacklist: []

