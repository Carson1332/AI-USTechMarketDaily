# 逐檔新聞 — Yahoo 的 per-ticker RSS,免 key、無配額,涵蓋範圍就是你的追蹤清單。
# 來源偏 SEO/評論網站,但事件分數會把那些擋掉,真正的公司行為(增資、可轉債、合約)會留下。
ticker_news:
  enabled: true
  max_tickers: 24        # 一檔一個請求,控制在合理範圍

# Marketaux — 只用來回答「這檔今天大漲/大跌,但今天的新聞源都沒提到它,為什麼?」
# 不當一般新聞源:免費方案每次請求只回 3 篇,而且來源品質低於現有的 RSS(見 fetch_marketaux.py)。
marketaux:
  enabled: true
  move_threshold: 4.0    # 快照裡漲跌超過這個%數才值得花一次請求去問
  max_requests: 8        # 每天配額 100,留餘裕
  min_match_score: 40.0  # entities[].match_score 低於此視為雜訊(代號只是順帶被提到)

# 總經行事曆 — Finnhub 的 /calendar/economic 是付費的(403),所以改走本機 Futu OpenD。
# OpenD 在你自己的機器上,GitHub Actions 連不到,因此拆成兩半:
#   本機  python tools/publish_econ_calendar.py --commit  → data/econ_calendar.json
#   CI    src/fetch_econ.py 讀那個檔
# 檔案過期或不存在都只是「這次沒有行事曆」,不會讓日報失敗。
# 排程頻率的取捨(實測 2026-08-26):Futu 的日期可以拉到 90 天,
# 但「市場預估 consensus」只有當週才有 —— 第 1 週之後全部是空的。
#   每週跑   → 事件 + 預估都齊,第九節可以給可對答案的驗證點
#   每兩週跑 → 約一半天數只有事件名稱、沒有預估
#   每月跑   → 約 3/4 天數沒有預估
# 舊檔不會給錯的數字,只會是空值,所以拉長排程是「功能變弱」不是「資料變錯」。
# 視窗要 >= 排程間隔 + days_ahead,漏跑一次才不會開天窗:
#   每週  --days 21,  max_age_days 21
#   每兩週 --days 35, max_age_days 35
#   每月  --days 67,  max_age_days 62
econ_calendar:
  path: "data/econ_calendar.json"
  days_ahead: 7          # 報告只看未來一週
  max_age_days: 21       # 超過就完全不採用;配合每週排程,改頻率請一起放大
  stale_after_days: 8    # 超過就在 Telegram 上提醒該手動跑了(每週排程 + 1 天寬限)

quotes:
  # Finnhub 是主來源。yahoo_fallback 只補 Finnhub 沒回的代號，不會覆蓋既有報價。
  # yfinance 走非官方 Yahoo 端點，Yahoo 改 auth 就會壞，CI 機房 IP 也可能被 429 ——
  # 所以它只是補位，壞掉就少幾檔，不會讓整份日報失敗。設 false 可完全關閉。
  yahoo_fallback: true

